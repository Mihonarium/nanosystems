name: Convert Markdown to EPUB

on:
  push:
    branches:
      - main
    paths:
      - full_book.md
      - preprocess_markdown_for_ebook.py
      - scripts/**
      - .github/workflows/convert-to-epub.yml
  pull_request:
    branches:
      - main
    paths:
      - full_book.md
      - preprocess_markdown_for_ebook.py
      - scripts/**
      - .github/workflows/convert-to-epub.yml

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pandoc and mathjax
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc
        npm install --no-save mathjax-full@3

    - name: Preprocess Markdown
      run: python3 preprocess_markdown_for_ebook.py

    - name: Convert to EPUB3 (display math as SVG)
      run: |
        pandoc full_book_preprocessed.md -o nanosystems.epub \
          --to epub3 --split-level=2 \
          --filter scripts/epub_math_filter.py \
          --metadata title="Nanosystems"

    - name: Validate XHTML well-formedness
      run: |
        python3 - <<'EOF'
        import zipfile, sys, xml.etree.ElementTree as ET
        z = zipfile.ZipFile('nanosystems.epub')
        bad = 0
        for n in z.namelist():
            if n.endswith('.xhtml'):
                try:
                    ET.fromstring(z.read(n))
                except ET.ParseError as e:
                    bad += 1
                    print('BROKEN', n, e)
        sys.exit(1 if bad else 0)
        EOF

    - name: Upload EPUB3
      uses: actions/upload-artifact@v4
      with:
        name: nanosystems_epub
        path: nanosystems.epub

    - name: Publish to the "ebook" release (stable download URL)
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view ebook --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create ebook --repo "$GITHUB_REPOSITORY" \
            --title "Nanosystems (EPUB)" \
            --notes "Auto-built EPUB of the book. Direct link: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/nanosystems.epub"
        gh release upload ebook nanosystems.epub --repo "$GITHUB_REPOSITORY" --clobber
